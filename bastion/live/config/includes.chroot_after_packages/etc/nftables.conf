#!/usr/sbin/nft -f
# Bastion Linux host firewall: drop all unsolicited inbound traffic.
# Add your own rules as *.nft files in /etc/nftables.d/, e.g.
#   add rule inet bastion input tcp dport 443 accept
# and apply them with: systemctl reload nftables

flush ruleset

table inet bastion {
	chain input {
		type filter hook input priority filter; policy drop;

		ct state invalid drop
		ct state { established, related } accept
		iif "lo" accept

		# ICMP/ICMPv6 needed for a healthy network (PMTU, ND, errors).
		ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 10/second accept
		ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert, mld-listener-query } accept

		# DHCP client replies.
		udp sport 67 udp dport 68 accept
		udp sport 547 udp dport 546 accept

		limit rate 5/second log prefix "bastion-drop: " level info
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

include "/etc/nftables.d/*.nft"
